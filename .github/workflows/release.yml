name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
              if [ -d "$dir" ]; then
                 echo "----- Rename $dir -----"
                 ksud_platform_name=$(basename "$dir")
                 find "$dir" -type f -name "ksud" -path "*/release/*" | while read -r ksud_file; do
                   if [ -f "$ksud_file" ]; then
                     mv "$ksud_file" "ksud/$ksud_platform_name"
                   fi
                 done
              fi
          done

      - name: Rename LKM artifacts
        run: |
          for f in ./*android*-lkm/*_kernelsu.ko; do
            [ -f "$f" ] || continue
            dir="${f%/*}"
            base="${f##*/}"
            arch="${dir#./}"
            arch="${arch%%-*}"
            mv "$f" "${dir}/${arch}_${base}"
          done

      - name: Zip AnyKernel3
        run: |
          for dir in AnyKernel3-*; do
            if [ -d "$dir" ]; then
              echo "----- Zip $dir -----"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip WSA kernel
        run: |
          for dir in kernel-WSA-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Zip ChromeOS ARCVM kernel
        run: |
          for dir in kernel-ARCVM-*; do
            if [ -d "$dir" ]; then
              echo "------ Zip $dir ----------"
              (cd $dir && zip -r9 "$dir".zip ./* -x .git .gitignore ./*.zip && mv *.zip ..)
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          name: mkkernel ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## mkkernel ${{ github.ref_name }}
            **Developer: MK** (@mkhyur)

            - `mkkernel-*.apk` (pasta manager): pacote normal `com.mkkernel.manager`
            - APK em `manager-spoofed`: pacote aleatorio (spoofed)
            - `*_kernelsu.ko`: modulo de kernel (LKM); AnyKernel3: zips para flash
            - `ksud-*`: daemon de userspace

            Compile o kernel com o hash da SUA chave (veja README, scripts/mk-keygen.sh).
          files: |
            manager/*.apk
            manager-spoofed/*.apk
            *android*-ksu-lkm/*_kernelsu.ko
            *android*-susfs-lkm/*_susfs_guard_lkm.ko
            AnyKernel3-*.zip
            boot-images-*/Image-*/*.img.gz
            kernel-WSA*.zip
            kernel-ARCVM*.zip
            ksud/ksud-*
